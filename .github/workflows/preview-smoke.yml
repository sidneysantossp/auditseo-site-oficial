name: Preview HTTP smoke

on:
  push:
    branches:
      - fix/launch-p0-search-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://auditseo-site-oficial-git-fix-launch-p0-search-6071ef-auditseo.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify automation bypass secret
        shell: bash
        run: |
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not configured. The Preview is protected by Vercel SSO, so the HTTP smoke cannot reach the application."
            exit 2
          fi
          echo "Automation bypass secret is configured."

      - name: Wait for Preview to respond
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$BASE_URL/robots.txt" || true)
            echo "Attempt $attempt: HTTP $code"
            if [[ "$code" != "000" && "$code" != "302" && "$code" != "401" && "$code" != "403" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview remained protected or unreachable."
          exit 1

      - name: Run launch smoke
        run: node scripts/smoke-launch.mjs "$BASE_URL"

      - name: Run lead delivery smoke
        run: node scripts/smoke-lead-delivery.mjs "$BASE_URL"
