name: Preview HTTP smoke

on:
  push:
    branches:
      - fix/launch-p0-search-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://auditseo-site-oficial-git-fix-launch-p0-search-6071ef-auditseo.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Preview to respond
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL/robots.txt" || true)
            echo "Attempt $attempt: HTTP $code"
            if [[ "$code" != "000" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become reachable"
          exit 1

      - name: Run launch smoke
        run: node scripts/smoke-launch.mjs "$BASE_URL"
