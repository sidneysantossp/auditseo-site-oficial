name: Preview HTTP smoke

on:
  push:
    branches:
      - fix/launch-p0-search-foundation
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://auditseo-site-oficial-git-fix-launch-p0-search-6071ef-auditseo.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify automation bypass secret
        shell: bash
        run: |
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not configured. The Preview is protected by Vercel SSO, so the HTTP smoke cannot reach the application."
            exit 2
          fi
          echo "Automation bypass secret is configured."

      - name: Wait for Vercel deployment of this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status"
          for attempt in {1..30}; do
            state=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$api" \
              | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel status for ${GITHUB_SHA}: ${state} (attempt ${attempt})"
            if [[ "$state" == "success" ]]; then
              exit 0
            fi
            if [[ "$state" == "failure" || "$state" == "error" ]]; then
              echo "::error::Vercel deployment failed for ${GITHUB_SHA}."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Vercel status of ${GITHUB_SHA}."
          exit 1

      - name: Wait for Preview to respond
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$BASE_URL/robots.txt" || true)
            echo "Attempt $attempt: HTTP $code"
            if [[ "$code" != "000" && "$code" != "302" && "$code" != "401" && "$code" != "403" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview remained protected or unreachable."
          exit 1

      - name: Run launch smoke
        run: node scripts/smoke-launch.mjs "$BASE_URL"

      - name: Run lead delivery smoke
        run: node scripts/smoke-lead-delivery.mjs "$BASE_URL"
