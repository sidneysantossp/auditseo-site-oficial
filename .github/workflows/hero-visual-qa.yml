name: Hero Visual QA

on:
  push:
    branches:
      - feat/hero-cinematic-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for visual QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/auditseo-vite.log 2>&1 &
          echo $! > /tmp/auditseo-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "App ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/auditseo-vite.log
          exit 1

      - name: Capture 1672x941 hero frame
        timeout-minutes: 3
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist']
          });
          const page = await browser.newPage({ viewport: { width: 1672, height: 941 }, deviceScaleFactor: 1 });
          page.on('console', msg => console.log('[browser]', msg.type(), msg.text()));
          page.on('pageerror', err => console.log('[pageerror]', err.message));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.evaluate(() => {
            document.documentElement.style.scrollBehavior = 'auto';
            window.scrollTo(0, 0);
          });
          await page.waitForTimeout(3000);
          const glInfo = await page.evaluate(() => {
            const canvas = document.querySelector('#inicio canvas');
            const gl = canvas?.getContext('webgl2') || canvas?.getContext('webgl');
            return { hasCanvas: !!canvas, hasWebGL: !!gl, width: canvas?.width || 0, height: canvas?.height || 0 };
          });
          console.log('GL_INFO', JSON.stringify(glInfo));
          await page.screenshot({ path: 'hero-qa.png', fullPage: false, timeout: 30000 });
          const metrics = await page.evaluate(() => {
            const hero = document.querySelector('#inicio');
            const h1 = hero?.querySelector('h1');
            const canvas = hero?.querySelector('canvas');
            return {
              viewport: [window.innerWidth, window.innerHeight],
              hero: hero ? hero.getBoundingClientRect().toJSON() : null,
              h1: h1 ? h1.getBoundingClientRect().toJSON() : null,
              canvas: canvas ? canvas.getBoundingClientRect().toJSON() : null,
              canvasPixels: canvas ? [canvas.width, canvas.height] : null,
            };
          });
          console.log(JSON.stringify(metrics, null, 2));
          await browser.close();
          EOF

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-visual-qa-${{ github.sha }}
          path: hero-qa.png
          if-no-files-found: error
          retention-days: 7
